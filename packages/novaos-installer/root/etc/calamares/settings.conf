# NovaOS installer (Calamares 3.3)
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: sources-media
  module: shellprocess
  config: shellprocess-sources-media.conf
- id: bootloader-config
  module: shellprocess
  config: shellprocess-bootloader-config.conf
- id: sources-final
  module: shellprocess
  config: shellprocess-sources-final.conf
- id: cleanup-live
  module: shellprocess
  config: shellprocess-cleanup-live.conf
- id: efi-fallback
  module: shellprocess
  config: shellprocess-efi-fallback.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - luksopenswaphookcfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@sources-media
  - shellprocess@cleanup-live
  - packages
  - shellprocess@bootloader-config
  - grubcfg
  - bootloader
  - shellprocess@efi-fallback
  - plymouthcfg
  - initramfscfg
  - initramfs
  - shellprocess@sources-final
  - umount
- show:
  - finished

branding: novaos
# Ask for an explicit confirmation before anything is written to disk.
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
