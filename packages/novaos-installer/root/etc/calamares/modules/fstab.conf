---
mountOptions:
    - filesystem: default
      options: [ defaults, noatime ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:1 ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: default
      type: ssd
      options: [ discard=async ]
crypttabOptions: luks,keyscript=/bin/cat
