---
# NovaOS partitioning. Nothing is written before the user confirmed the
# summary page AND the "Install now?" dialog (prompt-install in settings.conf).
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"

userSwapChoices:
    - none      # NovaOS uses compressed RAM swap (zram) by default
    - small
    - suspend   # needed for hibernation
    - file
initialSwapChoice: none

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
showNotEncryptedBootMessage: true

initialPartitioningChoice: none

defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]

# Offer full disk encryption (LUKS) as a checkbox
enableLuksAutomatedPartitioning: true
luksGeneration: luks1

partitionLayout:
    - name: "rootfs"
      filesystem: "unknown"
      mountPoint: "/"
      size: 100%
