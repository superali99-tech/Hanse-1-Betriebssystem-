---
defaultGroups:
    - adm
    - cdrom
    - floppy
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
    - users
    - name: sudo
      must_exist: true
      system: true
autologinGroup: autologin
sudoersGroup: sudo
sudoersConfigureWithGroup: false
# The first user is administrator (sudo); no separate root password.
setRootPassword: false
doReusePassword: true
doAutologin: false

passwordRequirements:
    nonempty: true
    minLength: 6
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false

user:
    shell: /bin/bash
    forbidden_names: [ root ]

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "novaos-${cpu}"
    forbidden_names: [ localhost ]

# Passwords are hashed by Calamares (SHA-512 crypt) and written to
# /etc/shadow of the target. They are never stored in clear text.
