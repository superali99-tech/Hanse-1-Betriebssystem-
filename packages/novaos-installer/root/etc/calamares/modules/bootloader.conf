---
efiBootLoader: "grub"
kernelSearchPath: "/boot"
kernelPattern: "^vmlinuz.*"
loaderEntries:
  - "timeout 3"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
# The removable-media path EFI/BOOT/BOOTX64.EFI is set up with Debian's
# signed shim by the grub-efi-amd64 package (see novaos-bootloader-config),
# Calamares must not overwrite it with an unsigned GRUB.
installEFIFallback: false
