# NovaOS – automatische Updates / automatic updates
#
# NovaOS sucht alle INTERVAL_DAYS Tage nach Updates (Debian-Pakete und
# systemweit installierte Apps aus dem Nova Store), lädt sie im Hintergrund
# herunter und installiert sie beim nächsten Neustart. Alle Benutzer erhalten
# die Meldung „Update verfügbar“ mit der Bitte, den PC neu zu starten.
#
# Status anzeigen:   /usr/libexec/novaos/nova-scheduled-update status
# Sofort suchen:     sudo /usr/libexec/novaos/nova-scheduled-update check --force

# yes = automatisch suchen, no = nur von Hand in Nova Updates
ENABLED=yes

# Abstand in Tagen (1-365)
INTERVAL_DAYS=14

# Apps aus dem Nova Store (Flatpak, systemweit) mit aktualisieren
FLATPAK=yes
