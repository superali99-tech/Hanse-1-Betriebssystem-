set default=0
set timeout=10
set timeout_style=menu

# The signed EFI GRUB looks for fonts in $prefix/fonts/, live-build puts the
# font into $prefix/. Try all locations so the themed menu has a font on
# BIOS and UEFI.
set novaos_font=0
for f in $prefix/unicode.pf2 $prefix/fonts/unicode.pf2 unicode ; do
	if [ $novaos_font = 0 ] ; then
		if loadfont $f ; then
			set novaos_font=1
		fi
	fi
done

if [ $novaos_font = 1 ] ; then
	set gfxmode=1024x768,800x600,auto
	set gfxpayload=keep
	# Only load modules that exist on the platform: the signed EFI GRUB has
	# efi_gop built in and no efi_uga; failing insmods would stop the menu
	# with an error message.
	if [ "${grub_platform}" = "efi" ] ; then
		insmod efi_gop
	else
		insmod vbe
		insmod video_bochs
		insmod video_cirrus
	fi
else
	set gfxmode=auto
	insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm
