# NovaOS live boot menu (GRUB, used for both BIOS and UEFI boot).
# Placeholders in @...@ are filled in by live-build (binary_grub_cfg).
source /boot/grub/config.cfg

menuentry "NovaOS starten (Live-System)" --hotkey=l --class novaos {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "NovaOS starten - sicherer Grafikmodus (nomodeset)" --hotkey=g --class novaos {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

menuentry "NovaOS starten - nur Arbeitsspeicher (toram)" --hotkey=r --class novaos {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram
	initrd	@INITRD_LIVE@
}

submenu "Erweiterte Optionen ..." --hotkey=a {
	source /boot/grub/theme.cfg

	menuentry "NovaOS starten - Fehlerbehebung (ausfuehrliche Meldungen)" {
		linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
		initrd	@INITRD_LIVE@
	}

	menuentry "Bootmedium auf Fehler pruefen" --hotkey=v {
		linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
		initrd	@INITRD_LIVE@
	}

	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI-Firmware-Einstellungen" --hotkey=f {
			fwsetup
		}
	fi

	menuentry "Neu starten" {
		reboot
	}

	menuentry "Ausschalten" {
		halt
	}
}
