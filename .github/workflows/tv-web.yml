# NovaOS website on GitHub Pages: the NovaOS website (start page, all updates with their
# details, guides - the same pages Nova Browser has built in) at the root, NovaOS TV Web
# (TV channels + Nova Filme for the browsers of Samsung, Philips, LG ... TVs) under /tv/.
# Runs every 3 hours so the Nova Filme rows stay current.
#
# Free address: https://superali99-tech.github.io/Hanse-1-Betriebssystem-/
# One-time setup in the repository: Settings -> Pages -> Source: "GitHub Actions"
# (and, to publish from a branch other than the default one, allow that branch under
# Settings -> Environments -> github-pages).
name: NovaOS website (GitHub Pages)

on:
  push:
    paths:
      - "website/**"
      - "docs/screenshots/**"
      - "tv/web/**"
      - "tv/res/raw/sender.m3u"
      - "tv/src/org/novaos/tv/Catalog.java"
      - "tv/src/org/novaos/tv/Channel.java"
      - "tv/src/org/novaos/tv/Video.java"
      - ".github/workflows/tv-web.yml"
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # pushes publish only from the default branch (schedule always runs there)
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build number = number of commits
      - name: NovaOS website
        run: |
          . ./VERSION.sh
          python3 website/build.py build/site --version "${NOVAOS_VERSION}.$(git rev-list --count HEAD)"
      - name: NovaOS TV Web (under /tv/)
        continue-on-error: true  # the main website is published even if the TV data cannot be built
        run: |
          ./tv/web/build.sh
          cp -r build/tv-web build/site/tv
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
